<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <!-- Solid arrow for Sequence Flow -->
    <marker id="seqArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e2421"/>
    </marker>
    <!-- Open hollow arrow for Message Flow -->
    <marker id="msgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#ffffff" stroke="#1e2421" stroke-width="1.3"/>
    </marker>
    <!-- Open circle start for Message Flow -->
    <marker id="msgStart" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7">
      <circle cx="5" cy="5" r="3.5" fill="#ffffff" stroke="#1e2421" stroke-width="1.4"/>
    </marker>
    <!-- Open V arrow for Data Association -->
    <marker id="dataArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5" fill="none" stroke="#1e2421" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Clean white background -->
  <rect width="1160" height="820" fill="#ffffff"/>

  <!-- ================= POOLS & LANES ================= -->
  <!-- Pool 1: Leitor (Cliente) -->
  <rect x="20" y="20" width="1120" height="250" fill="#ffffff" stroke="#1e2421" stroke-width="1.6"/>
  <line x1="66" y1="20" x2="66" y2="270" stroke="#1e2421" stroke-width="1.4"/>
  <text x="43" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#1e2421" transform="rotate(-90 43 145)">Leitor (Cliente)</text>

  <!-- Pool 2: Bibliotecario (Admin) -->
  <rect x="20" y="270" width="1120" height="250" fill="#ffffff" stroke="#1e2421" stroke-width="1.6"/>
  <line x1="66" y1="270" x2="66" y2="520" stroke="#1e2421" stroke-width="1.4"/>
  <text x="43" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#1e2421" transform="rotate(-90 43 395)">Bibliotecário (Admin)</text>

  <!-- Pool 3: Sistema GuMa -->
  <rect x="20" y="520" width="1120" height="280" fill="#ffffff" stroke="#1e2421" stroke-width="1.6"/>
  <line x1="66" y1="520" x2="66" y2="800" stroke="#1e2421" stroke-width="1.4"/>
  <text x="43" y="660" text-anchor="middle" font-size="14" font-weight="600" fill="#1e2421" transform="rotate(-90 43 660)">Sistema GuMa (Laravel + Supabase)</text>

  <!-- ================= POOL 1: LEITOR (CLIENTE) ================= -->
  <!-- Start Event -->
  <circle cx="112" cy="135" r="18" fill="#b7dfb9" stroke="#2d6a33" stroke-width="2"/>
  <text x="112" y="172" text-anchor="middle" font-size="12" fill="#1e2421">Início</text>

  <!-- Task 1: Cadastro e Login -->
  <rect x="170" y="99" width="138" height="72" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="239" y="131" text-anchor="middle" font-size="12.5" fill="#1e2421">Cadastrar ou</text>
  <text x="239" y="148" text-anchor="middle" font-size="12.5" fill="#1e2421">Fazer Login</text>

  <!-- Task 2: Explorar catalogo -->
  <rect x="348" y="99" width="162" height="72" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="429" y="124" text-anchor="middle" font-size="12.5" fill="#1e2421">Explorar catálogo</text>
  <text x="429" y="141" text-anchor="middle" font-size="12.5" fill="#1e2421">e buscar no</text>
  <text x="429" y="158" text-anchor="middle" font-size="12.5" fill="#1e2421">Google Books</text>

  <!-- XOR Gateway 1 -->
  <polygon points="570,111 594,135 570,159 546,135" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="570" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#1e2421">X</text>

  <!-- Upper Task: Minha estante -->
  <rect x="642" y="45" width="170" height="66" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="727" y="74" text-anchor="middle" font-size="12.5" fill="#1e2421">Consultar estante ou</text>
  <text x="727" y="91" text-anchor="middle" font-size="12.5" fill="#1e2421">cancelar solicitação</text>

  <!-- Lower Task: Solicitar emprestimo -->
  <rect x="642" y="160" width="170" height="66" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="727" y="189" text-anchor="middle" font-size="12.5" fill="#1e2421">Solicitar empréstimo</text>
  <text x="727" y="206" text-anchor="middle" font-size="12.5" fill="#1e2421">de livro</text>

  <!-- XOR Gateway 2 (Merge) -->
  <polygon points="872,111 896,135 872,159 848,135" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="872" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#1e2421">X</text>

  <!-- Task 4: Visualizar confirmacao -->
  <rect x="932" y="99" width="114" height="72" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="989" y="131" text-anchor="middle" font-size="12.5" fill="#1e2421">Receber</text>
  <text x="989" y="148" text-anchor="middle" font-size="12.5" fill="#1e2421">confirmação</text>

  <!-- End Event -->
  <circle cx="1095" cy="135" r="18" fill="#f3b7b7" stroke="#7f1d1d" stroke-width="4"/>
  <text x="1095" y="172" text-anchor="middle" font-size="12" fill="#1e2421">Fim</text>

  <!-- Pool 1 Sequence Flows -->
  <line x1="130" y1="135" x2="170" y2="135" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="308" y1="135" x2="348" y2="135" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="510" y1="135" x2="546" y2="135" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <polyline points="570,111 570,78 642,78" fill="none" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <polyline points="570,159 570,193 642,193" fill="none" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <polyline points="812,78 872,78 872,111" fill="none" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <polyline points="812,193 872,193 872,159" fill="none" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="896" y1="135" x2="932" y2="135" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="1046" y1="135" x2="1075" y2="135" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>

  <!-- ================= POOL 2: BIBLIOTECARIO (ADMIN) ================= -->
  <!-- Start Event -->
  <circle cx="112" cy="395" r="18" fill="#b7dfb9" stroke="#2d6a33" stroke-width="2"/>
  <text x="112" y="432" text-anchor="middle" font-size="12" fill="#1e2421">Início</text>

  <!-- Task B1: Login Bibliotecario -->
  <rect x="170" y="359" width="144" height="72" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="242" y="391" text-anchor="middle" font-size="12.5" fill="#1e2421">Login e acesso</text>
  <text x="242" y="408" text-anchor="middle" font-size="12.5" fill="#1e2421">ao Painel Admin</text>

  <!-- XOR Gateway B1 -->
  <polygon points="376,371 400,395 376,419 352,395" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="376" y="402" text-anchor="middle" font-size="20" font-weight="700" fill="#1e2421">X</text>

  <!-- Upper Branch: Analisar solicitacao -> Emprestimo/Devolucao -->
  <rect x="448" y="302" width="174" height="66" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="535" y="331" text-anchor="middle" font-size="12.5" fill="#1e2421">Analisar solicitação</text>
  <text x="535" y="348" text-anchor="middle" font-size="12.5" fill="#1e2421">(Aprovar ou Recusar)</text>

  <rect x="668" y="302" width="178" height="66" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="757" y="331" text-anchor="middle" font-size="12.5" fill="#1e2421">Registrar empréstimo</text>
  <text x="757" y="348" text-anchor="middle" font-size="12.5" fill="#1e2421">ou devolução</text>

  <!-- Lower Branch: Gerenciar acervo -->
  <rect x="520" y="422" width="230" height="66" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="635" y="451" text-anchor="middle" font-size="12.5" fill="#1e2421">Gerenciar acervo</text>
  <text x="635" y="468" text-anchor="middle" font-size="12.5" fill="#1e2421">(Cadastrar, Editar ou Excluir livro)</text>

  <!-- XOR Gateway B2 (Merge) -->
  <polygon points="920,371 944,395 920,419 896,395" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="920" y="402" text-anchor="middle" font-size="20" font-weight="700" fill="#1e2421">X</text>

  <!-- End Event -->
  <circle cx="1095" cy="395" r="18" fill="#f3b7b7" stroke="#7f1d1d" stroke-width="4"/>
  <text x="1095" y="432" text-anchor="middle" font-size="12" fill="#1e2421">Fim</text>

  <!-- Pool 2 Sequence Flows -->
  <line x1="130" y1="395" x2="170" y2="395" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="314" y1="395" x2="352" y2="395" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <polyline points="376,371 376,335 448,335" fill="none" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="622" y1="335" x2="668" y2="335" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <polyline points="376,419 376,455 520,455" fill="none" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <polyline points="846,335 920,335 920,371" fill="none" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <polyline points="750,455 920,455 920,419" fill="none" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="944" y1="395" x2="1075" y2="395" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>

  <!-- ================= POOL 3: SISTEMA GUMA ================= -->
  <!-- Start Event -->
  <circle cx="112" cy="610" r="18" fill="#b7dfb9" stroke="#2d6a33" stroke-width="2"/>
  <text x="112" y="647" text-anchor="middle" font-size="12" fill="#1e2421">Início</text>

  <!-- Task S1: Validar sessao/CSRF/permissoes -->
  <rect x="170" y="574" width="172" height="72" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="256" y="599" text-anchor="middle" font-size="12.5" fill="#1e2421">Validar CSRF, Sessão</text>
  <text x="256" y="616" text-anchor="middle" font-size="12.5" fill="#1e2421">HttpOnly e Permissões</text>
  <text x="256" y="633" text-anchor="middle" font-size="11.5" fill="#4f5953">(Cliente / Bibliotecário)</text>

  <!-- Task S2: Pepper + Hash/Salt -->
  <rect x="386" y="574" width="176" height="72" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="474" y="606" text-anchor="middle" font-size="12.5" fill="#1e2421">Aplicar Pepper (HMAC)</text>
  <text x="474" y="623" text-anchor="middle" font-size="12.5" fill="#1e2421">e Autenticar (Hash + Salt)</text>

  <!-- Task S3: Prepared Statements -->
  <rect x="606" y="574" width="182" height="72" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="697" y="599" text-anchor="middle" font-size="12.5" fill="#1e2421">Executar operação SQL</text>
  <text x="697" y="616" text-anchor="middle" font-size="12.5" fill="#1e2421">(Prepared Statements</text>
  <text x="697" y="633" text-anchor="middle" font-size="11.5" fill="#4f5953">e Triggers de Estoque)</text>

  <!-- Task S4: Logs -->
  <rect x="832" y="574" width="166" height="72" rx="10" fill="#ffffff" stroke="#1e2421" stroke-width="1.8"/>
  <text x="915" y="606" text-anchor="middle" font-size="12.5" fill="#1e2421">Registrar Logs</text>
  <text x="915" y="623" text-anchor="middle" font-size="12.5" fill="#1e2421">Operacionais</text>

  <!-- End Event -->
  <circle cx="1095" cy="610" r="18" fill="#f3b7b7" stroke="#7f1d1d" stroke-width="4"/>
  <text x="1095" y="647" text-anchor="middle" font-size="12" fill="#1e2421">Fim</text>

  <!-- Pool 3 Sequence Flows -->
  <line x1="130" y1="610" x2="170" y2="610" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="342" y1="610" x2="386" y2="610" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="562" y1="610" x2="606" y2="610" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="788" y1="610" x2="832" y2="610" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <line x1="998" y1="610" x2="1075" y2="610" stroke="#1e2421" stroke-width="1.6" marker-end="url(#seqArrow)"/>

  <!-- Data Store: PostgreSQL / Supabase -->
  <g transform="translate(669, 695)">
    <path d="M 0 10 L 0 46 A 28 9 0 0 0 56 46 L 56 10" fill="#ffffff" stroke="#1e2421" stroke-width="1.7"/>
    <ellipse cx="28" cy="10" rx="28" ry="9" fill="#ffffff" stroke="#1e2421" stroke-width="1.7"/>
    <path d="M 0 21 A 28 9 0 0 0 56 21" fill="none" stroke="#1e2421" stroke-width="1.3"/>
    <path d="M 0 32 A 28 9 0 0 0 56 32" fill="none" stroke="#1e2421" stroke-width="1.3"/>
  </g>
  <text x="697" y="769" text-anchor="middle" font-size="12" fill="#1e2421">Banco PostgreSQL / Supabase</text>
  <text x="697" y="784" text-anchor="middle" font-size="11" fill="#4f5953">(RLS + Triggers + Integridade)</text>

  <!-- Data Object: Arquivos de Logs -->
  <g transform="translate(894, 695)">
    <path d="M 0 0 L 30 0 L 42 12 L 42 52 L 0 52 Z" fill="#ffffff" stroke="#1e2421" stroke-width="1.7"/>
    <polyline points="30,0 30,12 42,12" fill="none" stroke="#1e2421" stroke-width="1.5"/>
  </g>
  <text x="915" y="769" text-anchor="middle" font-size="12" fill="#1e2421">Logs de Auditoria</text>
  <text x="915" y="784" text-anchor="middle" font-size="11" fill="#4f5953">(Login, Empréstimos, Acervo)</text>

  <!-- Data Associations (dotted) -->
  <line x1="697" y1="646" x2="697" y2="693" stroke="#1e2421" stroke-width="1.4" stroke-dasharray="3,3" marker-start="url(#dataArrow)" marker-end="url(#dataArrow)"/>
  <line x1="915" y1="646" x2="915" y2="693" stroke="#1e2421" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#dataArrow)"/>

  <!-- ================= MESSAGE FLOWS BETWEEN POOLS (dashed) ================= -->
  <!-- Pool 1 (Solicitar emprestimo) -> Pool 2 (Analisar solicitacao) -->
  <polyline points="727,226 727,252 535,252 535,302" fill="none" stroke="#1e2421" stroke-width="1.5" stroke-dasharray="7,5" marker-start="url(#msgStart)" marker-end="url(#msgArrow)"/>

  <!-- Pool 1 (Cadastrar/Login) -> Pool 3 (Validar Sessao) via clean left corridor -->
  <polyline points="239,171 239,246 330,246 330,545 256,545 256,574" fill="none" stroke="#1e2421" stroke-width="1.5" stroke-dasharray="7,5" marker-start="url(#msgStart)" marker-end="url(#msgArrow)"/>

  <!-- Pool 2 (Login Admin) -> Pool 3 (Validar Sessao) -->
  <line x1="230" y1="431" x2="230" y2="574" stroke="#1e2421" stroke-width="1.5" stroke-dasharray="7,5" marker-start="url(#msgStart)" marker-end="url(#msgArrow)"/>

  <!-- Pool 2 (Gerenciar acervo) -> Pool 3 (Executar operacao SQL) -->
  <line x1="697" y1="488" x2="697" y2="574" stroke="#1e2421" stroke-width="1.5" stroke-dasharray="7,5" marker-start="url(#msgStart)" marker-end="url(#msgArrow)"/>
</svg>
