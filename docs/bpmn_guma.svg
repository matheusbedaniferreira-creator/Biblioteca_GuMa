<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="dotArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#ffffff"/>

  <!-- Header -->
  <text x="20" y="28" font-size="16" font-weight="700" fill="#163f35">BPMN 2.0 — Fluxo Simplificado (Biblioteca GuMa)</text>

  <!-- Main Pool -->
  <rect x="20" y="42" width="1060" height="558" fill="#ffffff" stroke="#163f35" stroke-width="2"/>
  <rect x="20" y="42" width="32" height="558" fill="#163f35"/>
  <text x="36" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" transform="rotate(-90 36 321)">BIBLIOTECA GUMA</text>

  <!-- Lane 1: Leitor -->
  <rect x="52" y="42" width="1028" height="170" fill="#fafcfb" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="52" y="42" width="30" height="170" fill="#e6f0ec" stroke="#cbd5e1" stroke-width="1"/>
  <text x="67" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#163f35" transform="rotate(-90 67 127)">Leitor</text>

  <!-- Lane 2: Bibliotecario -->
  <rect x="52" y="212" width="1028" height="170" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="52" y="212" width="30" height="170" fill="#f5efe4" stroke="#cbd5e1" stroke-width="1"/>
  <text x="67" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#7c5628" transform="rotate(-90 67 297)">Bibliotecário</text>

  <!-- Lane 3: Sistema -->
  <rect x="52" y="382" width="1028" height="218" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="52" y="382" width="30" height="218" fill="#e8eef7" stroke="#cbd5e1" stroke-width="1"/>
  <text x="67" y="491" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a5f" transform="rotate(-90 67 491)">Sistema</text>

  <!-- ================= LANE 1: LEITOR ================= -->
  <circle cx="118" cy="127" r="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="118" y="159" text-anchor="middle" font-size="11" fill="#1e293b">Início</text>

  <rect x="166" y="97" width="140" height="60" rx="8" fill="#ffffff" stroke="#163f35" stroke-width="1.6"/>
  <text x="236" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Cadastrar / Login</text>
  <text x="236" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">(E-mail ou Google)</text>

  <rect x="346" y="97" width="146" height="60" rx="8" fill="#ffffff" stroke="#163f35" stroke-width="1.6"/>
  <text x="419" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Buscar Livro</text>
  <text x="419" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">(Catálogo / Google)</text>

  <rect x="532" y="97" width="150" height="60" rx="8" fill="#ffffff" stroke="#163f35" stroke-width="1.6"/>
  <text x="607" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Solicitar Empréstimo</text>
  <text x="607" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">(ou cancelar pedido)</text>

  <rect x="820" y="97" width="140" height="60" rx="8" fill="#ffffff" stroke="#163f35" stroke-width="1.6"/>
  <text x="890" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Retirar e Devolver</text>
  <text x="890" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">(Minha Estante)</text>

  <circle cx="1024" cy="127" r="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3.5"/>
  <text x="1024" y="159" text-anchor="middle" font-size="11" fill="#1e293b">Fim</text>

  <!-- Lane 1 Arrows -->
  <line x1="134" y1="127" x2="166" y2="127" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="306" y1="127" x2="346" y2="127" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="492" y1="127" x2="532" y2="127" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="682" y1="127" x2="820" y2="127" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="960" y1="127" x2="1006" y2="127" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= LANE 2: BIBLIOTECARIO ================= -->
  <polygon points="607,273 629,295 607,317 585,295" fill="#fef3c7" stroke="#b45309" stroke-width="1.7"/>
  <text x="607" y="301" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">X</text>

  <rect x="668" y="232" width="160" height="56" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="748" y="257" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Aprovar ou Recusar</text>
  <text x="748" y="273" text-anchor="middle" font-size="10.5" fill="#64748b">Solicitação / Devolução</text>

  <rect x="668" y="306" width="160" height="56" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="748" y="331" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Gerenciar Acervo</text>
  <text x="748" y="347" text-anchor="middle" font-size="10.5" fill="#64748b">(Criar, Editar, Excluir)</text>

  <circle cx="1024" cy="295" r="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3.5"/>
  <text x="1024" y="327" text-anchor="middle" font-size="11" fill="#1e293b">Fim</text>

  <!-- Lane 2 & Cross-Lane Arrows -->
  <line x1="607" y1="157" x2="607" y2="273" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="629,295 648,295 648,260 668,260" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="629,295 648,295 648,334 668,334" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="828,260 890,260 890,157" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="828,334 940,334 940,295 1006,295" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= LANE 3: SISTEMA ================= -->
  <rect x="166" y="416" width="164" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="248" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Validar Sessão, CSRF</text>
  <text x="248" y="459" text-anchor="middle" font-size="10.5" fill="#475569">e Permissões (RBAC)</text>

  <rect x="374" y="416" width="164" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="456" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Criptografia de Senha</text>
  <text x="456" y="459" text-anchor="middle" font-size="10.5" fill="#475569">(Pepper + Hash + Salt)</text>

  <rect x="582" y="416" width="174" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="669" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Executar SQL Seguro</text>
  <text x="669" y="459" text-anchor="middle" font-size="10.5" fill="#475569">(Prepared Statements)</text>

  <rect x="800" y="416" width="160" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="880" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Registrar Logs</text>
  <text x="880" y="459" text-anchor="middle" font-size="10.5" fill="#475569">Operacionais</text>

  <!-- Data Store: Banco PostgreSQL -->
  <g transform="translate(644, 512)">
    <path d="M 0 8 L 0 36 A 25 8 0 0 0 50 36 L 50 8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    <ellipse cx="25" cy="8" rx="25" ry="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
  </g>
  <text x="669" y="576" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">PostgreSQL / Supabase</text>

  <!-- Data Object: Logs -->
  <g transform="translate(862, 512)">
    <path d="M 0 0 L 24 0 L 34 10 L 34 42 L 0 42 Z" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    <polyline points="24,0 24,10 34,10" fill="none" stroke="#334155" stroke-width="1.4"/>
  </g>
  <text x="880" y="576" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Logs de Auditoria</text>

  <!-- Lane 3 Arrows -->
  <line x1="236" y1="157" x2="236" y2="416" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="330" y1="447" x2="374" y2="447" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="538" y1="447" x2="582" y2="447" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="756" y1="447" x2="800" y2="447" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="748" y1="362" x2="748" y2="416" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Data Associations -->
  <line x1="669" y1="478" x2="669" y2="510" stroke="#475569" stroke-width="1.4" stroke-dasharray="3,3" marker-start="url(#dotArrow)" marker-end="url(#dotArrow)"/>
  <line x1="880" y1="478" x2="880" y2="510" stroke="#475569" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#dotArrow)"/>
</svg>
